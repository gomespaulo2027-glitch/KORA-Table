name: Deploy MUKANDA Cozinha to GitHub Pages

on:
  push:
    branches:
      - demo/restaurante-2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MUKANDA
        uses: actions/checkout@v4
        with:
          ref: demo/restaurante-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static MUKANDA site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Verify static output
        run: |
          test -f .output/public/index.html
          test -f .output/public/menu/index.html
          test -f .output/public/experiencia/index.html
          test -f .output/public/contacto/index.html
          echo "GitHub Pages static output verified."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy MUKANDA artifact
        id: deployment
        uses: actions/deploy-pages@v4
